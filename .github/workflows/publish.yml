name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm CLI supports trusted publishing
        run: npm install --global npm@latest
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: Check whether this version is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "magpie-lobsterai-auth@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "magpie-lobsterai-auth@${version} is already on npm, skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: npm test
      - name: Lint
        run: npm run check
      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: npm publish --provenance --access public
